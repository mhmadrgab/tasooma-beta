@keyframes bl{to{stroke-opacity:.3}}

<style>
:root{--bg:#efede9;--card:#fff;--ink:#1b1b1b;--mut:#6f6b64;--line:#e6e2db;--acc:#a8832f;--soft:#f6f2e9;--field:#f3f1ed;--ring:rgba(168,131,47,.22);--new:#a8832f;--prep:#1d8a99;--done:#2f8f3e}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--card:#1a1a1a;--ink:#f1efec;--mut:#9d9a94;--line:#2f2f2f;--acc:#d4ae5c;--soft:#221f18;--field:#242424;--ring:rgba(212,174,92,.25);--new:#d4ae5c;--prep:#4cc0d1;--done:#5cc06c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
button,input,select{font:inherit;color:var(--ink)}
input,select{background:var(--field);border:1.5px solid transparent;border-radius:11px;padding:10px 12px;min-width:0}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--ring)}
.hd{background:#1b1b1b;border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:20}
.hi{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.br{display:flex;align-items:center;gap:12px}.lg1{height:46px}.lg2{height:38px}
.hd h1{margin:0;color:#fff;font-size:18px}.hd small{display:block;color:#cdb67a;font-size:12.5px}
.tabs{display:flex;gap:6px}.tabs button{background:none;border:1.5px solid #444;color:#ddd;border-radius:999px;padding:7px 18px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#1b1b1b;font-weight:700}
.tabs-out{background:none;border:1.5px solid #444;color:#ddd;border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit;font-size:14px}.live{display:flex;align-items:center;gap:6px;color:#9fd3a8;font-size:13px}.live i{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sc{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-top:4px solid var(--line)}
.sc small{color:var(--mut);display:block;font-size:13.5px}.sc b{font-size:34px;line-height:1.2;display:block}
.sc.n{border-top-color:var(--new)}.sc.p{border-top-color:var(--prep)}.sc.d{border-top-color:var(--done)}
.row2{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin-bottom:16px}
.pan{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pan h3{margin:0 0 10px;font-size:17px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.bar span:first-child{width:128px;flex:none;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--acc),#e8cf8a);min-width:4px}.bar em{font-style:normal;font-weight:700;margin-inline-start:auto}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.fl .chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.fl .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fl select,.fl input{margin-inline-start:auto}.fl select+input{margin-inline-start:0}
/* شريط فلاتر الطلبات (نوفمبر 2026): الفرع والتاريخ و"الطلبات الأقدم" مع بعض في كارت واحد، بدل ما كانوا متفرقين يمين ونص وشمال */
.fl.fbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;gap:10px;margin-top:-4px}
.fl.fbar select,.fl.fbar input{margin-inline-start:0}.fl.fbar select{min-width:190px;height:42px}.fl.fbar .drg input{height:42px}.fl.fbar .bt{height:42px}
/* الموبايل: أزرار أي صف عمودين متساويين (كانت كل واحد بعرض مختلف ومتلخبطين يمين وشمال) */
@media (max-width:560px){.fl:has(>.bt){align-items:stretch}.fl>.bt{flex:1 1 calc(50% - 4px);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.35;min-height:46px;margin-inline-start:0!important}
 /* العنوان سطر لوحده، والقوائم والخانات تحته نصّين (كانت بتتزق يمين وشمال بـ margin auto) */
 .fl>h2,.fl>h3{flex:1 1 100%}.fl>select,.fl>input{flex:1 1 calc(50% - 4px);margin-inline-start:0!important;min-width:0}}
@media (max-width:620px){.fl.fbar>*{flex:1 1 100%}.fl.fbar .drg{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.fl.fbar .drg label{flex-direction:column;align-items:stretch;gap:2px}.fl.fbar .drg input{width:100%}}
.rq{background:var(--card);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-inline-start:6px solid var(--new);overflow:hidden}
.rq.prep{border-inline-start-color:var(--prep)}.rq.done{border-inline-start-color:var(--done);opacity:.85}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.rh b{font-size:19px;direction:ltr;display:inline-block}.rh small{color:var(--mut);display:block}
.chp{border-radius:999px;padding:4px 14px;font-size:13.5px;font-weight:700;background:var(--soft)}
.rq.new .chp{background:#f6edd2;color:#6b5314}.rq.prep .chp{background:#d9ecf0;color:#0f5560}.rq.done .chp{background:#d8efd9;color:#1d5a24}
@media (prefers-color-scheme:dark){.rq.new .chp{background:#3a3115;color:#e8cf8a}.rq.prep .chp{background:#12383f;color:#8bd3e0}.rq.done .chp{background:#173a1b;color:#8fd39a}}
.kp{display:flex;gap:8px;padding:0 18px 12px;flex-wrap:wrap}.kp span{background:var(--soft);border-radius:10px;padding:4px 12px;font-size:14px}.kp b{font-size:17px}
details{padding:0 18px}details summary{cursor:pointer;color:var(--acc);padding:6px 0;font-weight:500}
.grp{columns:260px;column-gap:20px;padding:6px 0 12px}
.cg{break-inside:avoid;background:var(--field);border-inline-start:5px solid var(--acc);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.cg h4{margin:0 0 6px;font-size:19px;display:flex;justify-content:space-between}.cg h4 span{font-size:13px;font-weight:400;color:var(--mut)}
.cr{display:flex;gap:10px;margin-top:6px;padding-top:6px;border-top:1.5px dashed var(--line)}.cr:first-of-type{border:0;padding:0}
.cl{width:92px;flex:none;font-weight:700;word-break:break-word}.cc{display:flex;gap:8px;flex-wrap:wrap}.cd{text-align:center;min-width:44px}.cd i{font-style:normal;font-size:13px;border-bottom:1.5px solid var(--acc);display:block}.cd b{font-size:19px}
.nt{color:var(--mut);font-size:13px;width:100%}
.gn{background:var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:14px}
.rf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--soft)}
.bt{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:9px 18px;cursor:pointer;font-weight:700}
.bt.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.bt.g{background:var(--acc);border-color:var(--acc);color:#1b1b1b}.bt.r{margin-inline-start:auto;color:#c4362b}
.bt.s{padding:6px 12px;font-size:14px;font-weight:500}
table{width:100%;border-collapse:collapse}th{text-align:right;color:var(--mut);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:2px solid var(--acc)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}td.l{direction:ltr;text-align:right;font-weight:700}
.pin{font-family:ui-monospace,monospace;font-size:19px;letter-spacing:3px;font-weight:700}.off{color:var(--mut)}
.tw{overflow-x:auto}.em{text-align:center;color:var(--mut);padding:50px 10px}
.lg{max-width:380px;margin:12vh auto;background:var(--card);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.lg img{height:62px;background:#1b1b1b;padding:10px 16px;border-radius:14px}.lg h2{margin:8px 0}.lg p{color:var(--mut);margin:0 0 16px}.lg input{width:100%;text-align:center;margin-bottom:10px;font-size:18px}.lg .bt{width:100%;padding:13px}.er{color:#c4362b;min-height:22px;margin-top:8px;font-size:14px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-140px);z-index:80;background:#1b1b1b;color:#fff;padding:12px 22px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:.35s;border:1px solid var(--acc)}#toast.on{transform:translateX(-50%) translateY(0)}
.g{border-collapse:collapse;width:100%}.g th{padding:6px 8px;border-bottom:2px solid var(--acc);text-align:right;color:var(--mut);font-weight:500;font-size:13px}
.g td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.g .kc{font-size:24px;font-weight:700;border-inline-end:1px solid var(--line);vertical-align:top;width:1%;white-space:nowrap;direction:ltr}.g .tq{font-weight:700;font-size:20px;text-align:center}
.ch{display:inline-flex;align-items:stretch;margin:3px 0 3px 6px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.ch i{font-style:normal;padding:3px 10px;background:var(--field);color:var(--mut)}.ch b{padding:3px 10px;background:var(--soft);color:var(--ink)}
/* صنف غير متوفر (مشطوب) / مضاف من المستودع / كمية اتغيّرت */
.ch.na{opacity:.55;border-color:#c4362b;border-style:dashed}.ch.na b,.ch.na i{text-decoration:line-through;text-decoration-color:#c4362b;text-decoration-thickness:2px}
.ch.ad{border-color:#2f8f3e}.ch em{font-style:normal;padding:3px 6px;background:#e7f4ec;color:#1d5a24;font-size:12px}.ch s{padding:3px 8px;color:#c4362b;font-size:12px;align-self:center}
.nam{color:#c4362b;font-size:12.5px;font-weight:700;margin-top:4px}
.et tr.na td{background:#fdecea}.et tr.na input{text-decoration:line-through;color:#a33}.et tr.ad td:first-child{position:relative}.adm{position:absolute;inset-inline-start:-4px;top:-6px;font-size:13px}
.oqm{display:block;color:#c4362b;font-size:11.5px;margin-top:2px}.nab{white-space:nowrap}
@media (prefers-color-scheme:dark){.et tr.na td{background:#3a1715}.ch em{background:#173a1b;color:#8fd39a}}
.bx2{display:inline-block;width:24px;height:24px;border:2.5px solid #666;border-radius:6px;vertical-align:middle}.cm3{color:var(--mut);font-size:14px}
.grp{columns:auto;column-gap:0;overflow-x:auto;padding:6px 0 12px}
#pa{display:none}
#em{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);overflow:auto;padding:18px}#em.on{display:block}
.eb{max-width:920px;margin:0 auto;background:var(--card);border-radius:18px;padding:20px 22px}.eb h3{margin:0 0 4px}.eb label{display:block;color:var(--mut);font-size:13px;margin:14px 0 4px}
.eb textarea{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:11px;padding:10px 12px;min-height:60px;font:inherit;color:var(--ink)}
.et td{padding:4px 3px;border:0}.et input{width:100%;padding:8px 8px;font-size:15px}.et td:nth-child(4) input{font-weight:700;text-align:center}.et th{border-bottom:2px solid var(--acc)}
a.bt{text-decoration:none;display:inline-block;color:inherit}.tg{background:#f6edd2;color:#6b5314;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-inline-start:6px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.hd h1{font-size:16px}.lg2{display:none}.bar span:first-child{width:96px}}

function restoreUi(s){

g("em").addEventListener("click",async e=>{
 const t=e.target.closest("[data-rm],[data-na],#eadd,#esv,#ecx");if(!t||!ED)return;
 if(t.dataset.na!==undefined){const x=ED.rows[+t.dataset.na];if(x){x.na=x.na?0:1;drawEd()}}
 else if(t.dataset.rm!==undefined){ED.rows.splice(+t.dataset.rm,1);if(!ED.rows.length)ED.rows.push(blankRow());drawEd()}
 else if(t.id==="eadd"){const l=ED.rows[ED.rows.length-1]||blankRow();ED.rows.push({k:l.k,c:l.c,z:"",q:"",n:"",add:1});drawEd();const ins=g("em").querySelectorAll("tbody tr:last-child input");if(ins[2])ins[2].focus()}
 else if(t.id==="ecx"){ED=null;drawEd()}
 else if(t.id==="esv"){
  const rows=ED.rows.map(x=>{const q=Math.min(99999,Math.max(0,NUM(x.q))),o={k:String(x.k).trim().slice(0,40),c:String(x.c).trim().slice(0,40),z:String(x.z).trim().slice(0,20),q,n:String(x.n).trim().slice(0,200)};
   if(x.na)o.na=1;if(x.add)o.add=1;else if(x._o!==q)o.oq=x._o;return o}).filter(x=>x.k&&x.q>0);
  const L=live(rows);
  if(!L.length){toast(rows.length?"كل الأصناف غير متوفرة. اترك صنفاً متوفراً على الأقل، أو احذف الطلب.":"الطلب فارغ. اكتب كوداً وكمية.");return}

  // العدد والقطع = المتوفر بس (علشان سند السيستم يطابق المنصة)
  const codes=new Set(L.map(x=>x.k)).size,pcs=L.reduce((a,x)=>a+x.q,0),id=ED.id;
  try{await updateDoc(doc(db,"requests",id),{rows,codes,pcs,gn:String(ED.gn||"").slice(0,1000),edited:true,eat:Date.now(),edn:String(ROLE.name||"").slice(0,60)});ED=null;drawEd();toast("تم حفظ التعديل، وأُبلغ الفرع");ping(auth,[id])}catch(x){toast("تعذر الحفظ: "+(x&&x.code||x&&x.message))}
 }
});
document.addEventListener("click",async e=>{

 try{
 if(t.dataset.t){if(okTab(t.dataset.t)){tab=t.dataset.t;draw()}}
 else if(t.dataset.s){fs=t.dataset.s;draw()}
 else if(t.id==="logout"){await signOut(auth)}
 else if(t.dataset.a){const r=R.find(x=>x.id===t.dataset.id),a=t.dataset.a;if(!r)return;
  if(a==="print")printReq(r);
  else if(a==="edit")openEdit(r);
  else if(a==="del"){
   // (نوفمبر 2026) طلب مع سواق في رحلة: مسحه كان بيعلّق الرحلة (السواق مايقدرش يسلّم ولا يقفل). لازم الرحلة تخلص أو الطلب يرجع الأول

   if(r.st==="recv"&&!ROLE.owner){toast("أكّد الفرع استلام هذا الطلب ولا يمكن حذفه");return}if(ROLE.admin&&confirm(r.st==="recv"?`حذف طلب ${r.no} نهائياً؟\n\nأكّد الفرع استلام هذا الطلب، وسيُحذف من سجلات الفرع وتقييم العمال أيضاً، ولا يمكن التراجع.`:`حذف طلب ${r.no} نهائياً؟`))await deleteDoc(doc(db,"requests",r.id))}// الطلب اللي الفرع أكّد استلامه: المالك بس يمسحه (والقواعد كمان)
  else if(a==="wk"||(a==="prep"&&r.st==="new"&&hasWorkers()))pickWorkers(r);// نختار مين هيجهّز الطلب
   else if(a==="pdn"){if(r.st!=="prep"){toast("ابدأ التجهيز أولاً");return}await updateDoc(doc(db,"requests",r.id),{pdn:Date.now(),upd:Date.now()});ping(auth,[r.id]);toast("✅ تم التجهيز، وأُبلغ الفرع")}
    else if(["new","prep","done"].includes(a)){if(r.st==="recv"){toast("أكّد الفرع استلام هذا الطلب ولا يمكن تغييره");return}await updateDoc(doc(db,"requests",r.id),{st:a,upd:Date.now(),...(a==="new"||a==="prep"?{pdn:0}:{})});ping(auth,[r.id])}}
 else if(t.dataset.sp){const c=t.dataset.sp,el=document.querySelector(`[data-pw-cell="${c}"]`);if(el){const shown=el.dataset.v==="1";el.textContent=shown?"••••••••":P[c];el.dataset.v=shown?"0":"1";t.textContent=shown?"إظهار":"إخفاء"}}
 else if(t.dataset.mk){const c=t.dataset.mk;await mkBranch(c);toast("تم إنشاء حساب الفرع "+c)}
 else if(t.dataset.shp){
   // فرع خارج الرياض: اسم شركة الشحن (فاضي = فرع عادي). السائق بيسلّم لها والفرع بيستلم منها
   if(!ROLE.admin){toast("هذه الصلاحية للمدير فقط");return}
   const c=t.dataset.shp,cur=SH[c]||"",v=prompt(`فرع ${c}: اكتب اسم شركة الشحن التي يسلّم لها السائق (مثلاً: سمسا، أرامكس، ناقل).\n\nاتركه فارغاً إن كان الفرع عادياً والسائق يوصله بنفسه.`,cur);
   if(v===null)return;const nv=String(v).trim().slice(0,60),c2={...SH};if(nv)c2[c]=nv;else delete c2[c];
   await setDoc(doc(db,"ship","main"),{c:c2});toast(nv?`فرع ${c}: شحن عن طريق ${nv}`:`فرع ${c}: عاد فرعاً عادياً`)}
 else if(t.dataset.tg){const c=t.dataset.tg,on=!B[c];if(on||confirm(`تعطيل فرع ${c}؟ لن يتمكن من الدخول أو إرسال الطلبات.`)){await setDoc(doc(db,"branches",c),{enabled:on});toast(on?"تم التفعيل":"تم التعطيل")}}
 else if(t.dataset.pw){const c=t.dataset.pw;if(!P[c]){toast("كلمة المرور الحالية غير مسجلة. استخدم ربط حساب موجود.");return}const nw=prompt("كلمة المرور الجديدة (6 أحرف على الأقل). اتركها فارغة لتوليد كلمة عشوائية:","");if(nw===null)return;await setPw(c,P[c],nw.trim()||genPw());toast("تم تغيير كلمة المرور")}
 else if(t.dataset.ad){const c=t.dataset.ad,pw=prompt(`اكتب كلمة مرور حساب ${emailOf(c)} الموجود في Firebase:`,"");if(!pw)return;await adopt(c,pw.trim());toast("تم الربط")}
 else if(t.dataset.cp)cpy(msg(t.dataset.cp));
 else if(t.id==="genall"){
  const todo=BR.map(code).filter(c=>!(c in B));if(!todo.length){toast("كل الحسابات منشأة");return}
  if(!confirm(`إنشاء ${todo.length} حساب فرع؟`))return;
  let ok=0;const bad=[];
  for(const c of todo){try{await mkBranch(c);ok++}catch(x){if(x&&x.code==="auth/admin-restricted-operation"){window.uiSignupOff&&uiSignupOff("حسابات الفروع");return}bad.push(c+": "+AERR(x))}await sleep(300)}
  toast(`تم إنشاء ${ok} حساب`+(bad.length?` — فشل ${bad.length}`:""));
  if(bad.length)alert("الحسابات التي فشلت:\n"+bad.join("\n"));
 }
 else if(t.id==="cpall")cpy(BR.filter(b=>P[code(b)]&&B[code(b)]).map(b=>msg(code(b))).join("\n\n———\n\n"));
 }catch(x){if(!(window.uiAuthErr&&uiAuthErr(x,"الفرع")))toast(AERR(x))}
});
document.addEventListener("change",e=>{if(e.target.id==="fb"){fb=e.target.value;draw()}if(e.target.id==="fdf"||e.target.id==="fdt"){if(e.target.id==="fdf")fdf=e.target.value;else fdt=e.target.value;if(fdf&&fdt&&fdf>fdt)[fdf,fdt]=[fdt,fdf];draw()}});

const deny=async m=>{lastErr=m;stop();login(m);try{await signOut(auth)}catch(e){}};
// صلاحيات الحساب من staff/{email}. المتابع (v) مالوش أي صلاحية تعديل حتى لو اتعلّم غلط
const roleOf=s=>{const v=s.v===true;return {admin:!v&&s.admin===true,owner:false,v,p:v?{}:(s.p||{}),name:s.name||"",k:s.k||""}};
async function enterStaff(u){
 const em=String(u.email||"").toLowerCase();
 try{
  const s=await withTimeout(getDoc(doc(db,"staff",em)),12000);
  if(auth.currentUser!==u)return;// اتغيّر الحساب وإحنا مستنيين
  if(!s.exists()||s.data().enabled!==true){deny("هذا الحساب غير مفعّل للدخول إلى لوحة المستودع");return}
  ROLE=roleOf(s.data());start();// admin=true: مدير كامل زي صاحب الحساب، v=true: متابع بس (صاحب الشركة)
  let first2=true;
  stW=onSnapshot(doc(db,"staff",em),d=>{
   if(!d.exists()||d.data().enabled!==true){if(stW){stW();stW=null}deny("تم إيقاف حسابك");return}
   if(first2){first2=false;return}
   const nr=roleOf(d.data());
   if(JSON.stringify(nr.p)!==JSON.stringify(ROLE.p)||nr.name!==ROLE.name||nr.admin!==ROLE.admin||nr.v!==ROLE.v){ROLE=nr;stop();start()}
   else if((d.data().k||"")!==ROLE.k){ROLE.k=d.data().k||"";draw()}// الكنية اتغيّرت بس
  },()=>{});
 }catch(e){
  if(e&&e.code==="permission-denied")return void deny("تعذر التحقق من الصلاحيات. تأكد من تحديث القواعد (Rules)");
  // لا يوجد نت: الدخول محفوظ، فمش بنخرّجه. بنستنى النت ونحاول مجدداً (ولا يوجد أي بيانات بتظهر إلى ما نتأكد)
  waitNet(u,()=>enterStaff(u));
 }
}
let netT=null;
function waitNet(u,fn){
 clearTimeout(netT);
 g("app").innerHTML=`<div class="lg"><div class="tzl-row">${TZL.btn()}</div><img src="${LOGO1}" alt=""><h2>لوحة المستودع</h2><p>📡 لا يوجد اتصال بالإنترنت حالياً</p><p class="off" style="font-size:14px">دخولك محفوظ. فور عودة الإنترنت ستفتح اللوحة تلقائياً.</p><button class="bt p" id="nr" type="button">حاول مجدداً</button> <button class="bt" id="nx" type="button">خروج</button></div>`;
 const go=()=>{clearTimeout(netT);removeEventListener("online",go);if(auth.currentUser===u)fn()};
 g("nr").onclick=go;g("nx").onclick=()=>signOut(auth);addEventListener("online",go);netT=setTimeout(go,8000);
}
onAuthStateChanged(auth,async u=>{
 if(stW){stW();stW=null}
 if(u&&u.email===ADMIN_EMAIL){ROLE={admin:true,owner:true,p:{},name:OWNER_NAME,k:""};start()}// الاسم والكنية بيتحدّثوا من meta/me (ملفي الشخصي)
 else if(u&&u.email){stop();await enterStaff(u)}
 else{stop();const m=lastErr;lastErr="";login(m)}
 window.uiReady&&uiReady();// حالياً بس نعرض الصفحة (دخول أو لوحة)
 // إشعارات الجوال: الجهاز يسجّل نفسه (السيرفر بيتأكد من الصلاحية الحقيقية قبل ما يبعت)
 if(u&&u.email){const em=u.email.toLowerCase();window.__push=()=>pushRegister(app,db,{role:"staff",key:em,email:em});window.__pushTest=()=>pushTest(auth);autoPush()}else{window.__push=null;window.__pushTest=null}
});
