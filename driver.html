 g("pf").onchange=async()=>{const f=g("pf").files[0];img="";if(!f)return;busy=true;g("ph").textContent="جاري ضغط الصورة...";try{img=await shrink(f,800,120000);g("ph").textContent="تم تجهيز الصورة ✅"}catch(e){g("pf").value="";g("ph").textContent="الصورة غير صالحة"}busy=false};
 g("p0").onclick=closeM;
 g("p1").onclick=async()=>{
  const od=N(toEn(g("po").value));
  if(!(od>0)){toast("اكتب قراءة العداد","er");return}
  if(od<lo){toast(`يجب أن تكون قراءة العداد ${lo} أو أكثر (آخر قراءة)`,"er");return}
  if(od-lo>MAXLEG){toast(`الرقم كبير جداً (${od-lo} كم من آخر قراءة). راجع العداد`,"er");return}
  const wb=sh&&g("pw")?g("pw").value.trim().slice(0,40):"";
  if(sh&&!wb&&!img){toast("اكتب رقم البوليصة أو صوّر إيصال شركة الشحن","er");return}
  const nm=g("pn").value.trim();if(!nm){toast("اكتب اسم المستلم","er");return}
  if(busy){toast("انتظر حتى تنتهي الصورة","er");return}
  g("p1").disabled=true;g("p1").textContent="جاري الحفظ...";
  const ts=Date.now(),loc=await here();let pod={name:nm.slice(0,60),at:ts},pics=null;if(sh){pod.co=String(sh).slice(0,60);if(wb)pod.wb=wb}// تسليم لشركة الشحن: اسم الشركة ورقم البوليصة
  if(drawn){const sg=cv.toDataURL("image/png");if(sg.length<=40000)(pics=pics||{}).sig=sg}
  if(img)(pics=pics||{}).img=img;
  try{
   // الصورة والتوقيع في مستند لوحده (pods/{رقم الطلب})، مش جوه الطلب: الطلب بيتقري مع كل فتحة للوحة،
   // ولو الصور جوّاه كانت حصة النقل المجانية في Firebase هتخلص والمنصة تقف. على الطلب علامة بس (ph/sg).
   // لو القواعد اللي في Firebase لا يزال قديمة (مابتعرفش pods) بنرجع للطريقة القديمة علشان التسليم مايقفش.
   if(pics){
    try{await withTimeout(setDoc(doc(db,"pods",rid),{...pics,at:ts,drv:me.id}),15000);if(pics.img)pod.ph=1;if(pics.sig)pod.sg=1}
    catch(e){if(e&&e.code==="permission-denied")pod={...pod,...pics};else throw e}
   }
   const st=(a.stops||[]).map(x=>{if(x.rid!==rid)return x;const o={...x,arr:ts,rcvr:nm.slice(0,60),odo:od};const ct2=ctV(g("pct")?g("pct").value:"");if(ct2)o.ct=ct2;if(loc){o.lat=loc.lat;o.lng=loc.lng}return o});
   const rem=st.filter(x=>!x.arr),et=etas(rem,ts,codeOf(s.brn));// الباقي محسوب من الفرع اللي سُلِّم حالياً
   const stt=st.map(x=>et[x.rid]?{...x,eta:et[x.rid]}:x);
   const b=writeBatch(db),tu={stops:stt};if(loc)tu.loc={...loc,ts};
   // ⚠️ (نوفمبر 2026) طلب اتمسح من المستودع وهو في الرحلة: مانكتبش عليه (كان بيرفض التسليم كله والرحلة بتعلق). REQ = طلباتي الموجودة فعلاً
   const has=x=>REQ.some(r=>r.id===x);
   b.update(doc(db,"trips",a.id),tu);if(has(rid))b.update(doc(db,"requests",rid),{st:"done",dlv:ts,upd:ts,pod});
   rem.forEach(x=>{if(et[x.rid]&&has(x.rid))b.update(doc(db,"requests",x.rid),{eta:et[x.rid]})});
   await withTimeout(b.commit(),15000);delete CT[rid];ctSave();ping(auth,[rid]);closeM();lsSet("drv_odo_"+a.car,String(od));
   // آخر فرع: نفكّره ينهي الرحلة لما يرجع (علشان رحلة قصيرة الرجوع يتحسب)
   toast(rem.length?"تم تسجيل التسليم ✅":"تم التسليم ✅ أنهيت كل التوصيلات. عند عودتك إلى المستودع اضغط 🏁 إنهاء الرحلة واكتب العداد");
  }catch(e){const x=g("p1");if(x){x.disabled=false;x.textContent="تأكيد التسليم ✅"}fail(e,"غير مسموح. ربما غيّر المستودع حالة الطلب.")}
 };
}
function fuelForm(){
 const a=active(),cid=a?a.car:(g("sc")&&g("sc").value)||lsGet("drv_car")||"",c=CARS.find(x=>x.id===cid)||CARS[0];
 openM(`<h3>⛽ تسجيل بنزين</h3><label>السيارة</label><select id="fcar">${CARS.map(x=>`<option value="${E(x.id)}" ${c&&x.id===c.id?"selected":""}>${E(x.name)}</option>`).join("")}</select>
 <label>اللترات</label><input id="fl" inputmode="decimal"><label>المبلغ</label><input id="fm" inputmode="decimal"><label>قراءة العداد (كم)</label><input id="fo" inputmode="numeric" value="${E(a?"":lsGet("drv_odo_"+(c?c.id:""))||"")}">
 <label style="display:flex;gap:10px;align-items:center"><input id="ff" type="checkbox" style="width:24px;height:24px"> ملأت الخزان بالكامل</label>
 <div class="row"><button class="b" id="f0" type="button">رجوع</button><button class="b p" id="f1" type="button">حفظ</button></div>`);
 g("f0").onclick=closeM;
 g("f1").onclick=async()=>{
  const cc=CARS.find(x=>x.id===g("fcar").value),l=N(toEn(g("fl").value)),m=N(toEn(g("fm").value)),o=N(toEn(g("fo").value));
  if(!cc||!(l>0)||l>500||m<0||!(o>0)){toast("اكتب اللترات والمبلغ والعداد","er");return}
  g("f1").disabled=true;
  try{await withTimeout(addDoc(collection(db,"fuel"),{drv:me.id,drvn:me.name,car:cc.id,carn:cc.name,ts:Date.now(),dt:today(),liters:l,cost:m,odo:o,full:g("ff").checked}),15000);lsSet("drv_odo_"+cc.id,String(o));closeM();toast("تم تسجيل البنزين ✅")}
  catch(e){g("f1").disabled=false;fail(e,"غير مسموح بالتسجيل.")}
 };
}
function endForm(){
 const a=active();if(!a)return;const un2=(a.stops||[]).filter(s=>!s.arr),lo=lastOdo(a);
 openM(`<h3>🏁 إنهاء الرحلة</h3>${un2.length?`<div class="mut" style="color:#c4362b;font-weight:700">يوجد ${un2.length} توصيلة لم تُسلَّم بعد (${un2.map(s=>E(s.brn)).join("، ")}) — سترجع إلى المستودع.</div>`:""}
 <label>قراءة العداد الآن (كم) — ${lo>N(a.odo0)?`آخر قراءة ${lo} (كانت ${N(a.odo0)} في البداية)`:`كانت ${N(a.odo0)} في البداية`}</label><input id="eo" inputmode="numeric"><label>ملاحظة (اختياري)</label><input id="en" maxlength="300">
 <div class="row"><button class="b" id="e0" type="button">رجوع</button><button class="b p" id="e1" type="button">إنهاء</button></div>`);
 g("e0").onclick=closeM;
 g("e1").onclick=async()=>{
  const o=N(toEn(g("eo").value));if(!(o>=lo)||o>9999999){toast("يجب أن تكون قراءة العداد "+lo+" أو أكثر (آخر قراءة)","er");return}
  if(o-lo>MAXLEG){toast(`الرقم كبير جداً (${o-lo} كم من آخر قراءة). راجع العداد`,"er");return}
  g("e1").disabled=true;const ts=Date.now(),loc=await here();
  try{
   const b=writeBatch(db),u={st:"done",end:ts,odo1:o},n=g("en").value.trim().slice(0,300);if(n)u.note=n;if(loc)u.loc={...loc,ts};
   // (الطلب اللي اتمسح من المستودع وهو في الرحلة بيتساب: من غيرها الرحلة مابتتقفلش خالص)
   b.update(doc(db,"trips",a.id),u);un2.filter(s=>REQ.some(r=>r.id===s.rid)).forEach(s=>b.update(doc(db,"requests",s.rid),{st:"prep",upd:ts}));
   await withTimeout(b.commit(),15000);ping(auth,un2.map(s=>s.rid),[],[a.id]);lsSet("drv_odo_"+a.car,String(o));closeM();toast("تم إنهاء الرحلة. شكراً لجهدك 👏");
  }catch(e){g("e1").disabled=false;fail(e,"غير مسموح بإنهاء الرحلة.")}
 };
}
regSW();
